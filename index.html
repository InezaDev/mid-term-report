<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G.S. ST ETIENNE SHYOGWE · Mid-term Report Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#00080f;--sf:rgba(255,255,255,.04);--sf2:rgba(255,255,255,.07);
  --bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.14);
  --tx:#eef5fb;--mu:#8ba3bd;--pr:#00d4b8;--pr2:#00a896;--prtxt:#00151a;
  --gd:#f2b705;--rd:#f04e56;--gn:#22c55e;
  --sidebar:280px;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,Arial,sans-serif;overflow-x:hidden}
canvas#bg3d{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ============ LANDING ============ */
.landing{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px}
.landing-card{max-width:520px;width:100%;text-align:center;background:rgba(0,20,35,.75);backdrop-filter:blur(20px);border:1px solid var(--bd2);border-radius:24px;padding:48px 36px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(0,212,184,.1)}
.landing-card img{width:96px;height:96px;border-radius:20px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.landing-card h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:20px 0 8px;line-height:1.2;background:linear-gradient(135deg,#fff,#7de8d6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.landing-card p{color:var(--mu);font-size:14px;margin-bottom:28px;line-height:1.7}
.btn-google{background:#fff;color:#1a1a1a;border:1px solid #dadce0;border-radius:12px;padding:14px 22px;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;font-weight:600;font-size:15px;cursor:pointer;transition:.2s}
.btn-google:hover{box-shadow:0 6px 24px rgba(0,0,0,.35);transform:translateY(-1px)}
.google-icon{width:20px;height:20px;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="%23EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="%234285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="%23FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="%2334A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>') no-repeat center/contain}
.landing-note{color:var(--mu);font-size:12px;margin-top:22px;line-height:1.6}
.loading-screen{display:grid;place-items:center;min-height:100vh;position:relative;z-index:1;color:var(--mu);font-size:14px}
.loading-screen .spin{width:36px;height:36px;border:3px solid var(--bd2);border-top-color:var(--pr);border-radius:50%;animation:spin 0.9s linear infinite;margin-bottom:18px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ APP SHELL ============ */
.app{position:relative;z-index:1;display:flex;min-height:100vh;padding:16px;gap:16px}
.sidebar{width:var(--sidebar);flex-shrink:0;background:rgba(0,15,28,.85);backdrop-filter:blur(24px);border:1px solid var(--bd);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;position:sticky;top:16px;height:calc(100vh - 32px)}
.sb-brand{display:flex;align-items:center;gap:12px;padding:20px 20px 18px;border-bottom:1px solid var(--bd)}
.sb-brand img{width:42px;height:42px;border-radius:10px;background:#fff}
.sb-brand b{font-size:14px;font-weight:700;display:block;letter-spacing:-.2px}
.sb-brand span{font-size:11px;color:var(--pr);font-weight:500}
.sb-nav{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.sb-nav::-webkit-scrollbar{width:4px}
.sb-nav::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
.sb-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;color:var(--mu);font-size:13.5px;font-weight:500;transition:.15s;border:0;background:none;width:100%;text-align:left}
.sb-item:hover{background:var(--sf);color:var(--tx)}
.sb-item.on{background:linear-gradient(135deg,rgba(0,212,184,.15),rgba(0,168,150,.08));color:var(--pr);box-shadow:inset 0 0 0 1px rgba(0,212,184,.3)}
.sb-item .ico{width:18px;height:18px;flex-shrink:0;opacity:.85}
.sb-item.on .ico{opacity:1}
.sb-foot{padding:14px 16px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:10px}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--sf)}
.user-chip img{width:32px;height:32px;border-radius:50%;background:#fff;flex-shrink:0}
.user-chip .info{flex:1;min-width:0;overflow:hidden}
.user-chip b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip span{display:block;font-size:10.5px;color:var(--pr);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.btn-signout{background:transparent;border:1px solid var(--bd2);color:var(--mu);border-radius:10px;padding:8px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;width:100%}
.btn-signout:hover{border-color:var(--rd);color:var(--rd)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.4px}
.term-picker{display:flex;align-items:center;gap:8px}
.term-picker label{color:var(--mu);font-size:12px;font-weight:500}
.content{flex:1;min-width:0}

.menu-btn{display:none;background:var(--sf);border:1px solid var(--bd);color:var(--tx);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:18px}

/* ============ CARDS & UI ============ */
.card{background:rgba(0,20,35,.7);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:700;color:var(--tx);margin:0 0 14px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.card h2 .badge{font-size:10.5px;background:var(--sf2);color:var(--pr);padding:2px 8px;border-radius:20px;border:1px solid rgba(0,212,184,.3);font-weight:600;letter-spacing:.3px}

.grid{display:grid;gap:14px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g-4,.g-3,.g-2{grid-template-columns:1fr}}

.stat-card{background:rgba(0,20,35,.7);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden;transition:.2s}
.stat-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,212,184,.06),transparent 60%);pointer-events:none}
.stat-card:hover{border-color:var(--bd2);transform:translateY(-2px)}
.stat-card .label{font-size:11.5px;color:var(--mu);font-weight:500;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.stat-card .value{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1;background:linear-gradient(135deg,#fff,#7de8d6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-card .unit{font-size:14px;color:var(--mu);font-weight:500;margin-left:2px}
.stat-card .foot{font-size:12px;color:var(--mu);margin-top:8px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mu);font-weight:500}
input,select,textarea{background:rgba(0,15,28,.85);border:1px solid var(--bd2);border-radius:10px;padding:9px 12px;color:var(--tx);font-size:13.5px;transition:.15s;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px rgba(0,212,184,.15)}
input::placeholder{color:var(--mu);opacity:.6}

.btn{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--prtxt);border:0;border-radius:10px;padding:10px 18px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;letter-spacing:-.1px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,212,184,.25)}
.btn:active{transform:translateY(0)}
.btn.s{background:transparent;color:var(--pr);border:1px solid rgba(0,212,184,.4)}
.btn.s:hover{background:rgba(0,212,184,.08);box-shadow:none}
.btn.g{background:var(--sf);color:var(--tx);border:1px solid var(--bd2)}
.btn.g:hover{background:var(--sf2);box-shadow:none}
.btn.d{background:rgba(240,78,86,.15);color:var(--rd);border:1px solid rgba(240,78,86,.3)}
.btn.d:hover{background:rgba(240,78,86,.25);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}

.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--bd)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{background:rgba(0,15,28,.6);color:var(--pr);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;padding:11px 12px;text-align:left;border-bottom:1px solid var(--bd2);white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--bd);color:var(--tx)}
table.t tr:last-child td{border-bottom:0}
table.t tr:hover td{background:rgba(0,212,184,.03)}
table.t input.m{padding:5px 8px;font-size:12.5px;width:90px;background:rgba(0,15,28,.9)}
table.t img.avatar{width:28px;height:28px;border-radius:50%;background:#fff}

.empty{color:var(--mu);text-align:center;padding:36px 20px;font-size:13.5px}
.empty b{color:var(--tx);font-weight:600}

.bar-row{display:grid;grid-template-columns:120px 1fr 60px;gap:12px;align-items:center;font-size:13px;padding:6px 0}
.bar-track{background:rgba(255,255,255,.06);height:6px;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--pr),#5ce8d5);border-radius:3px;transition:width .5s ease}
.bar-val{text-align:right;color:var(--mu);font-weight:600;font-size:12px}

.search{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.search input{flex:1;min-width:200px}
.search .count{color:var(--mu);font-size:12px;white-space:nowrap}

.badge-role{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.badge-role.admin{background:rgba(242,183,5,.15);color:var(--gd);border:1px solid rgba(242,183,5,.3)}
.badge-role.teacher{background:rgba(0,212,184,.12);color:var(--pr);border:1px solid rgba(0,212,184,.3)}

/* ============ REPORT CARD (Rwanda CAMIS) ============ */
.pv{overflow-x:auto;background:#5d6b82;padding:16px;border-radius:12px}
.rp{width:794px;min-height:1120px;background:#fff;color:#000;font:11px Arial,Helvetica,sans-serif;padding:24px;margin:0 auto;box-sizing:border-box}
.rp table{border-collapse:collapse;width:100%}
.rp td,.rp th{border:1px solid #000;padding:3px 2px;text-align:center;font-size:10px}
.rp td.l{text-align:left;padding-left:4px}
.rp .r{color:#e00}
.rp .hd{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.rp .hd div.ad{font-size:10px;line-height:1.35;width:230px}
.rp .bx{border:1px solid #000;padding:10px 28px;font-weight:700;font-size:14px;text-align:center;margin-top:6px}
.rp .nm{border:2px solid #000;padding:8px;display:flex;justify-content:space-between;font-size:11px;margin-bottom:10px}
.rp .gs{background:#bbb;text-align:left}
.rp .sec{display:flex;gap:10px;margin-top:10px}
.rp .bd{border:2px solid #000;padding:8px;font-size:10px;flex:1;display:flex;justify-content:space-between;gap:10px}

/* ============ TOASTS ============ */
#toasts{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:linear-gradient(135deg,rgba(0,212,184,.95),rgba(0,168,150,.95));color:#00151a;padding:12px 18px;border-radius:12px;font-weight:700;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:slideIn .3s;pointer-events:auto;max-width:340px}
.toast.err{background:linear-gradient(135deg,rgba(240,78,86,.95),rgba(200,40,50,.95));color:#fff}
.toast.info{background:rgba(0,20,35,.98);color:var(--tx);border:1px solid var(--bd2)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ============ MODAL ============ */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:9998;display:grid;place-items:center;padding:16px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.mo-box{background:rgba(0,20,35,.98);border:1px solid var(--bd2);border-radius:18px;padding:28px;max-width:400px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.mo-box h3{font-size:17px;font-weight:700;margin-bottom:10px}
.mo-box p{color:var(--mu);font-size:13.5px;line-height:1.6;margin-bottom:20px}
.mo-actions{display:flex;gap:10px;justify-content:flex-end}

/* ============ MOBILE ============ */
@media(max-width:900px){
  .app{padding:8px;gap:0}
  .sidebar{position:fixed;top:8px;bottom:8px;left:8px;width:280px;transform:translateX(-300px);transition:transform .3s ease;z-index:100}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex;align-items:center;justify-content:center}
  .main{width:100%}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}
  .backdrop.show{opacity:1;pointer-events:auto}
  .page-title{font-size:18px}
  .rp{width:100%;min-height:auto;padding:14px}
}

@media print{
  body{background:#fff}
  canvas#bg3d,.sidebar,.topbar,.btn,.row,.mo,#toasts{display:none!important}
  .app{padding:0}
  .card,.pv{background:#fff;border:0;padding:0;margin:0;box-shadow:none}
  .rp{margin:0;padding:14mm;width:auto;min-height:auto;page-break-after:always}
}
</style>
</head>

}

    document.body.appendChild(mo);
    mo.querySelector('#cyes').onclick = ()=>{mo.remove();res(true);};
    mo.querySelector('#cno').onclick = ()=>{mo.remove();res(false);};
  });
}

}

/* =========================================================
   3D BACKGROUND — gentle floating particle depth field
   ========================================================= */
(function init3D(){
  const cv = document.getElementById('bg3d');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H;
  const particles = [];
  const COUNT = 160;

  function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  for (let i=0;i<COUNT;i++){
    particles.push({
      x: Math.random()*W,
      y: Math.random()*H,
      z: Math.random()*2.5 + 0.3,      // depth 0.3 – 2.8
      vz: 0.0015 + Math.random()*0.002, // toward viewer
      phase: Math.random()*Math.PI*2
    });
  }

  let mx = W/2, my = H/2;
  window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

  function frame(){
    // Deep radial gradient
    const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.9);
    g.addColorStop(0, '#001a2e');
    g.addColorStop(0.55, '#000d1a');
    g.addColorStop(1, '#00060d');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    const px = (mx - W/2) * 0.02;
    const py = (my - H/2) * 0.02;

    // Sort by depth so far ones render first
    particles.sort((a,b)=> b.z - a.z);

    for (let i=0;i<particles.length;i++){
      const p = particles[i];
      if (!reduce) {
        p.z -= p.vz;
        if (p.z < 0.15) {
          p.z = 2.8;
          p.x = Math.random()*W;
          p.y = Math.random()*H;
        }
      }
      const scale = 1 / p.z;
      const sx = W/2 + (p.x - W/2) * scale + px * (2.8 - p.z);
      const sy = H/2 + (p.y - H/2) * scale + py * (2.8 - p.z);
      if (sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;

      const baseSize = (2.8 - p.z) * 0.9 + 0.3;
      const alpha = Math.min(0.7, (2.8 - p.z) * 0.35);
      const twinkle = 0.6 + 0.4 * Math.sin(Date.now()*0.0008 + p.phase);

      // Halo
      const halo = ctx.createRadialGradient(sx, sy, 0, sx, sy, baseSize * 8);
      halo.addColorStop(0, `rgba(0, 230, 200, ${alpha * twinkle * 0.4})`);
      halo.addColorStop(0.5, `rgba(0, 180, 220, ${alpha * twinkle * 0.15})`);
      halo.addColorStop(1, 'rgba(0, 150, 200, 0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(sx, sy, baseSize * 8, 0, Math.PI*2);
      ctx.fill();

      // Core
      ctx.fillStyle = `rgba(200, 255, 245, ${alpha * twinkle})`;
      ctx.beginPath();
      ctx.arc(sx, sy, Math.max(0.5, baseSize), 0, Math.PI*2);
      ctx.fill();
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  frame();
})();

/**
 * Creates users/{uid} with role='teacher' if it doesn't exist.
 * NEVER reads the users collection — that's admin-only.
 */
async function ensureProfile(fbUser){
  const ref = doc(db, 'users', fbUser.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) return snap.data();
  const profile = {
    email: fbUser.email,
    name: fbUser.displayName || fbUser.email,
    photoURL: fbUser.photoURL || '',
    role: 'teacher',
    createdAt: new Date().toISOString()
  };
  await setDoc(ref, profile);
  return profile;
}

   AUTH STATE
   ========================================================= */
let userDocUnsub = null;
let usersColUnsub = null;

function attachUsersIfAdmin(){
  if (!S.isAdmin){
    if (usersColUnsub){ usersColUnsub(); usersColUnsub = null; }
    S.users = [];
    return;
  }
  if (usersColUnsub) return;
  usersColUnsub = onSnapshot(collection(db, 'users'),
    snap => { S.users = snap.docs.map(d => ({id:d.id, ...d.data()})); if (S.ready) draw(); },
    err => {
      // Silently swallow — rules will block non-admins
      console.warn('users snapshot:', err.code);
    }
  );
}

onAuthStateChanged(auth, async fbUser => {
  if (userDocUnsub){ userDocUnsub(); userDocUnsub = null; }

  if (!fbUser){
    S.user = null; S.isAdmin = false; S.ready = true;
    attachUsersIfAdmin();
    draw();
    return;
  }

  try {
    const profile = await ensureProfile(fbUser);
    S.user = {
      uid: fbUser.uid,
      email: profile.email || fbUser.email,
      name: profile.name || fbUser.displayName || fbUser.email,
      photoURL: profile.photoURL || fbUser.photoURL || '',
      role: profile.role || 'teacher'
    };
    S.isAdmin = S.user.role === 'admin';
    if (S.tab === 'ov' && !S.isAdmin) S.tab = 'students';

    // Live-watch own user doc so role changes apply instantly
    userDocUnsub = onSnapshot(doc(db, 'users', fbUser.uid), snap => {
      if (!snap.exists()) return;
      const d = snap.data();
      S.user.role = d.role || 'teacher';
      S.user.name = d.name || S.user.name;
      S.user.photoURL = d.photoURL || S.user.photoURL;
      S.isAdmin = S.user.role === 'admin';
      if (S.isAdmin && !['ov','cs','students','marks','reports','users','settings','backup'].includes(S.tab)) S.tab = 'ov';
      attachUsersIfAdmin();
      if (S.ready) draw();
    });
  } catch(e){
    console.error('Profile error:', e);
    toast('Could not load profile: ' + e.message, 'err');
  }
  S.ready = true;
  attachUsersIfAdmin();
  draw();
});

getRedirectResult(auth).catch(err => {
  if (err.code !== 'auth/no-auth-event') {
    console.warn('redirect:', err.code, err.message);
  }
});

   ========================================================= */
let listenersAttached = false;
function attachListeners(){
  if (listenersAttached) return;
  listenersAttached = true;
  onSnapshot(collection(db, 'classes'),
    snap => { S.cl = snap.docs.map(d => ({id:d.id, ...d.data()})); recalc(); if (S.ready) draw(); },
    err => console.warn('classes:', err.code)
  );
  onSnapshot(collection(db, 'students'),
    snap => { S.st = snap.docs.map(d => ({id:d.id, ...d.data()})); recalc(); if (S.ready) draw(); },
    err => console.warn('students:', err.code)
  );
  onSnapshot(doc(db, 'settings', 'school'),
    snap => { S.settings = snap.exists() ? snap.data() : {}; if (S.ready) draw(); },
    err => console.warn('settings:', err.code)
  );
}
onAuthStateChanged(auth, u => { if (u) attachListeners(); });

/* =========================================================
   FIRESTORE HELPERS
   ========================================================= */
const FS = {
  set: (path, data) => { const [c,...r]=path.split('/'); return setDoc(doc(db,c,...r), data); },
  update: (path, data) => { const [c,...r]=path.split('/'); return updateDoc(doc(db,c,...r), data); },
  delete: (path) => { const [c,...r]=path.split('/'); return deleteDoc(doc(db,c,...r)); },
  get: (path) => { const [c,...r]=path.split('/'); return getDoc(doc(db,c,...r)); }
};

/* =========================================================
   CALCULATIONS
   ========================================================= */
function calc(s){
  const sb = CL(s.cls)?.subjects || [];
  const k = S.term;
  const mx = sb.reduce((a,b)=>a+b.w,0) || 1;
  let has = false, tot = 0;
  const r = sb.map(b => {
    const v = s['mt_'+b.id+'_'+k];
    const a = (v==null||v==='') ? null : +v;
    if (a != null) has = true;
    tot += a || 0;
    return { a, p: (a||0)/b.w*100 };
  });
  return { sb, r, tot, mx, has, p: tot/mx*100 };
}
function recalc(){
  S.calc = {}; S.ranks = {};
  S.st.forEach(s => S.calc[s.id] = calc(s));
  S.cl.forEach(cl => {
    const L = S.st.filter(s => s.cls === cl.id && S.calc[s.id].has);
    L.forEach(s => {
      S.ranks[s.id] = (1 + L.filter(o => S.calc[o.id].p > S.calc[s.id].p).length) + ' out of ' + L.length;
    });
  });
}

/* =========================================================

   ========================================================= */
function renderApp(){

  const tabs = S.isAdmin ? NAV_ADMIN : NAV_TEACHER;
  if (!tabs.find(t => t[0] === S.tab)) S.tab = tabs[0][0];
  if (S.tab === 'ov' && !S.isAdmin) S.tab = 'students';

  const isOverview = S.tab === 'ov';
  const isCS = S.tab === 'cs';
  const isReports = S.tab === 'reports';
  const isMarks = S.tab === 'marks';
  const isStudents = S.tab === 'students';
  const isUsers = S.tab === 'users';
  const isSettings = S.tab === 'settings';
  const isBackup = S.tab === 'backup';
  const showClassTerm = (isStudents || isMarks || isReports) && CUR();

  const sidebar = `
    <aside class="sidebar ${S.sidebarOpen?'open':''}" id="sidebar">

        <img src="${LOGO}" alt="">
        <div><b>G.S. ST ETIENNE</b><span>Mid-term Portal</span></div>
      </div>
      <nav class="sb-nav">
        ${tabs.map(([k,l,ico]) => `<button class="sb-item ${S.tab===k?'on':''}" data-t="${k}"><span class="ico">${ico}</span>${l}</button>`).join('')}
      </nav>
      <div class="sb-foot">
        <div class="user-chip">
          ${S.user.photoURL ? `<img src="${E(S.user.photoURL)}" alt="">` : ''}
          <div class="info"><b>${E(S.user.name)}</b><span>${S.user.role}</span></div>
        </div>
        <button class="btn-signout" id="so">Sign out</button>
      </div>
    </aside>

  `;

  const topbar = `
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-btn" id="menuBtn">☰</button>
        <h1 class="page-title">${TITLES[S.tab]||'Dashboard'}</h1>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${showClassTerm ? `
          <div class="term-picker">
            <label>Class</label>
            <select id="selClass">${S.cl.slice().sort(cmp).map(c => `<option value="${c.id}" ${c.id===S.cur?'selected':''}>${E(c.name)}</option>`).join('')}</select>
            <label>Term</label>
            <select id="selTerm">${[1,2,3].map(n => `<option value="${n}" ${n===S.term?'selected':''}>Term ${n}</option>`).join('')}</select>
          </div>

  $('#root').innerHTML = `

      ${sidebar}
      <main class="main">
        ${topbar}
        <div class="content">${content}</div>
      </main>
    </div>
  `;

  bindApp();
}

function bindApp(){
  $$('[data-t]').forEach(b => b.onclick = () => { S.tab = b.dataset.t; S.sidebarOpen = false; draw(); });
  const so = $('#so'); if (so) so.onclick = googleSignOut;
  const mb = $('#menuBtn'); if (mb) mb.onclick = () => { S.sidebarOpen = !S.sidebarOpen; draw(); };
  const bd = $('#backdrop'); if (bd) bd.onclick = () => { S.sidebarOpen = false; draw(); };
  const sc = $('#selClass'); if (sc) sc.onchange = e => { S.cur = e.target.value; S.sel = S.sub = null; draw(); };
  const st = $('#selTerm'); if (st) st.onchange = e => { S.term = +e.target.value; recalc(); draw(); };
  bindFor(S.tab);
}

/* =========================================================
   VIEWS
   ========================================================= */
function viewFor(tab){
  if (!S.isAdmin && tab === 'ov') tab = 'students';
  if (!CUR() && ['students','marks','reports'].includes(tab)) {
    return `<div class="card"><div class="empty"><b>No class available</b><br>${S.isAdmin ? 'Create a class first under Classes & subjects.' : 'The admin has not created any classes yet.'}</div></div>`;
  }
  return ({ov:vOverview, cs:vClasses, students:vStudents, marks:vMarks, reports:vReports, users:vUsers, settings:vSettings, backup:vBackup})[tab]();
}
function bindFor(tab){
  ({ov:()=>{}, cs:bindClasses, students:bindStudents, marks:bindMarks, reports:bindReports, users:bindUsers, settings:bindSettings, backup:bindBackup})[tab]();
}

/* ---- OVERVIEW ---- */
function vOverview(){
  const L = S.st.filter(s => S.calc[s.id].has);
  const av = L.length ? L.reduce((a,s)=>a+S.calc[s.id].p,0)/L.length : 0;
  const lo = L.filter(s => S.calc[s.id].p < 50).length;
  const rows = S.cl.slice().sort(cmp).map(c => {
    const M = S.st.filter(s => s.cls === c.id && S.calc[s.id].has);
    return { name: c.name, avg: M.length ? M.reduce((a,s)=>a+S.calc[s.id].p,0)/M.length : 0, count: M.length };
  });
  return `
    <div class="grid g-4" style="margin-bottom:14px">
      <div class="stat-card"><div class="label">Classes</div><div class="value">${S.cl.length}</div></div>
      <div class="stat-card"><div class="label">Students</div><div class="value">${S.st.length}</div></div>
      <div class="stat-card"><div class="label">School Average</div><div class="value">${F(av)}<span class="unit">%</span></div><div class="foot">${L.length} students with marks</div></div>
      <div class="stat-card"><div class="label">Below 50%</div><div class="value">${lo}</div><div class="foot">${L.length-lo} above pass</div></div>
    </div>
    <div class="card">
      <h2>Average by class <span class="badge">Term ${S.term}</span></h2>
      ${rows.length ? rows.map(r => `
        <div class="bar-row">
          <span>${E(r.name)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,r.avg)}%"></div></div>
          <span class="bar-val">${r.avg ? F(r.avg)+'%' : '—'}</span>
        </div>
      `).join('') : '<div class="empty">No classes yet.</div>'}
    </div>
  `;
}

      ${c ? `<div class="row" style="margin-top:14px">
        <label>New subject<input id="bn" placeholder="Mathematics"></label>
        <label>Max<input id="bw" type="number" min="1" value="50" style="width:90px"></label>
        <button class="btn" id="as">+ Add subject</button>
        <label>Copy from<select id="cf"><option value="">Choose class</option>${cs.filter(x=>x.id!==c.id&&(x.subjects||[]).length).map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join('')}</select></label>
      </div>` : ''}
    </div>
  `;
}
function bindClasses(){
  const mk = (n, cb) => FS.set('classes/' + ids(n), { name: n.trim(), combo: cb || '', subjects: CL(ids(n))?.subjects || [] });
  $('#ac').onclick = async () => {
    const n = $('#cn').value;
    if (!n.trim()) return toast('Enter a class name', 'err');
    try { await mk(n, $('#cb').value); S.cur = ids(n); toast('Class created'); }
    catch(e){ toast('Failed: ' + e.message, 'err'); }
  };
  $('#aq').onclick = async () => {
    let added = 0;
    try {
      for (const n of ['P1','P2','P3','P4','P5','P6','S1','S2','S3','S4','S5','S6']) {
        if (!CL(n)) { await mk(n, ''); added++; }
      }
      toast(added + ' classes added');
    } catch(e){ toast('Bulk add failed: ' + e.message, 'err'); }
  };
  const c = CUR();
  const cc2 = $('#cc2'); if (cc2) cc2.onchange = e => { S.cur = e.target.value; draw(); };
  if (!c) return;
  const save = a => FS.update('classes/' + c.id, { subjects: a });
  const sb = () => (c.subjects || []).map(x => ({...x}));
  const dc = $('#dc'); if (dc) dc.onclick = async () => {
    if (!await confirmDialog('Delete class ' + c.name + '?')) return;
    try { await FS.delete('classes/' + c.id); toast('Class deleted'); }
    catch(e){ toast('Failed: ' + e.message, 'err'); }
  };
  const as = $('#as'); if (as) as.onclick = async () => {
    const n = $('#bn').value.trim(), w = +$('#bw').value;
    if (!n || !(w > 0)) return toast('Enter subject name and max mark', 'err');
    try { await save([...sb(), { id: 's' + Date.now().toString(36), n, w }]); toast('Subject added'); }
    catch(e){ toast('Failed: ' + e.message, 'err'); }
  };
  const cf = $('#cf'); if (cf) cf.onchange = async e => {
    const o = CL(e.target.value);
    if (!o) return;
    if (!await confirmDialog('Replace subjects of ' + c.name + ' with those of ' + o.name + '?')) return;
    try {
      await save(o.subjects.map(x => ({ id: 's' + Math.random().toString(36).slice(2,8), n: x.n, w: x.w })));
      toast('Subjects copied');
    } catch(e){ toast('Failed: ' + e.message, 'err'); }
  };
  $$('[data-ds]').forEach(b => b.onclick = async () => {
    if (!await confirmDialog('Remove this subject?')) return;
    try { await save(sb().filter(x => x.id !== b.dataset.ds)); toast('Subject removed'); }
    catch(e){ toast('Failed: ' + e.message, 'err'); }
  });
  $$('.sn,.sw').forEach(i => i.onchange = async () => {
    const a = sb(), x = a.find(y => y.id === i.dataset.s);
    if (i.classList.contains('sn')) x.n = i.value.trim() || x.n;
    else x.w = Math.max(1, +i.value || x.w);
    try { await save(a); } catch(e){ toast('Failed: ' + e.message, 'err'); }
  });
}

function bindStudents(){
  const add = async (n, i) => {
    n = (n||'').trim(); i = (i||'').trim();
    if (!n || !i) return false;
    const id = ids(i);
    if (S.st.find(s => s.id === id)) { toast('ID ' + i + ' exists', 'err'); return false; }
    try { await FS.set('students/' + id, { name: n, uid: i, cls: S.cur }); return true; }
    catch(e){ toast('Failed: ' + e.message, 'err'); return false; }
  };
  $('#add').onclick = async () => {
    if (await add($('#sn').value, $('#si').value)) { $('#sn').value = $('#si').value = ''; toast('Student registered'); }
  };
  $('#bl').onclick = async () => {
    let ok = 0;
    for (const l of $('#bulk').value.split('\n')) {
      const p = l.split(',');
      if (p.length > 1 && await add(p[0], p[1])) ok++;
    }
    $('#bulk').value = '';
    toast(ok + ' registered');
  };
  $('#srch').oninput = e => { S.search = e.target.value; draw(); };
  $('#clr').onclick = () => { S.search = ''; draw(); };
  $$('[data-del]').forEach(b => b.onclick = async () => {
    if (!await confirmDialog('Delete this student and all their marks?')) return;
    try { await FS.delete('students/' + b.dataset.del); toast('Deleted'); }
    catch(e){ toast('Failed: ' + e.message, 'err'); }
  });
  $$('.mv').forEach(i => i.onchange = async () => {
    try { await FS.update('students/' + i.dataset.id, { cls: i.value }); }
    catch(e){ toast('Failed: ' + e.message, 'err'); }
  });
  $$('.cd').forEach(i => i.onchange = async () => {
    try { await FS.update('students/' + i.dataset.id, { [i.dataset.k]: i.value === '' ? null : Math.min(40, +i.value) }); }
    catch(e){ toast('Failed: ' + e.message, 'err'); }
  });
}

/* ---- MARKS ---- */
function vMarks(){
  const sb = SB();
  if (!sb.length) return `<div class="card"><div class="empty"><b>No subjects</b><br>${S.isAdmin ? 'Add subjects under Classes & subjects.' : 'Admin has not set up subjects for this class.'}</div></div>`;
  if (!sb.find(b => b.id === S.sub)) S.sub = sb[0].id;
  const b = sb.find(x => x.id === S.sub), w = b.w;
  const M = MS().slice().sort((a,c)=>a.name.localeCompare(c.name));
  return `
    <div class="card">
      <h2>Subject <span class="badge">Max ${w}</span></h2>
      <div class="row">
        <label>Subject<select id="sb">${sb.map(x => `<option value="${x.id}" ${x.id===S.sub?'selected':''}>${E(x.n)}</option>`).join('')}</select></label>
      </div>
      <p style="color:var(--mu);font-size:12.5px;margin-top:12px">Enter each student's Term ${S.term} mark out of ${w}. Saves automatically.</p>
    </div>
    <div class="card">
      <h2>Marks <span class="badge">${M.length} students</span></h2>
      ${M.length ? `<div class="tw"><table class="t">
        <tr><th>Student</th><th>Mark /${w}</th><th>Percentage</th></tr>
        ${M.map(s => {
          const v = s[`mt_${b.id}_${S.term}`];
          return `<tr>
            <td>${E(s.name)}</td>
            <td><input class="m mi" type="number" min="0" max="${w}" data-id="${s.id}" value="${v??''}"></td>
            <td>${v==null||v===''?'—':`<b style="color:${(+v/w*100)>=50?'var(--gn)':'var(--rd)'}">${F(+v/w*100)}%</b>`}</td>
          </tr>`;
        }).join('')}
      </table></div>` : '<div class="empty">No students in this class yet.</div>'}
    </div>
  `;
}
function bindMarks(){
  const sb = $('#sb'); if (!sb) return;
  sb.onchange = e => { S.sub = e.target.value; draw(); };
  const w = SB().find(x => x.id === S.sub).w;
  $$('.mi').forEach(i => i.onchange = async () => {
    try {
      await FS.update('students/' + i.dataset.id, {
        [`mt_${S.sub}_${S.term}`]: i.value === '' ? null : Math.min(w, Math.max(0, +i.value))
      });
    } catch(e){ toast('Failed: ' + e.message, 'err'); }
  });
}

/* ---- REPORTS ---- */
function vReports(){
  const M = MS().slice().sort((a,b)=>a.name.localeCompare(b.name));
  if (!S.sel || !M.find(s => s.id === S.sel)) S.sel = M[0]?.id;
  const s = M.find(x => x.id === S.sel);
  return `
    <div class="card">
      <h2>Export report cards</h2>
      <div class="row">
        <label>Student<select id="ps">${M.map(x => `<option value="${x.id}" ${x.id===S.sel?'selected':''}>${E(x.name)}</option>`).join('')}</select></label>
        <button class="btn" id="dl" ${s?'':'disabled'}>⬇ PDF</button>
        <button class="btn s" id="da" ${s?'':'disabled'}>⬇ Whole class</button>
        <button class="btn g" id="pr" ${s?'':'disabled'}>🖨 Print</button>
      </div>
    </div>
    ${s ? `<div class="pv"><div id="one">${report(s)}</div></div>` : '<div class="empty">No students in this class yet.</div>'}
    <div id="all" style="position:fixed;left:-9999px;top:0"></div>
  `;
}
function bindReports(){
  const sel = $('#ps'); if (!sel) return;
  sel.onchange = e => { S.sel = e.target.value; draw(); };
  const s = S.st.find(x => x.id === S.sel), cn = CUR().name;
  $('#dl').onclick = () => pdf($('#one .rp'), 'Midterm-T'+S.term+'-'+ids(s.name)+'.pdf');
  $('#pr').onclick = () => window.print();
  $('#da').onclick = () => {
    $('#all').innerHTML = MS().sort((a,b)=>a.name.localeCompare(b.name)).map(x => `<div class="pg">${report(x)}</div>`).join('');
    pdf($('#all'), 'Midterm-T'+S.term+'-'+ids(cn)+'-all.pdf');
  };
}
async function pdf(el, name){
  toast('Preparing PDF…', 'info');
  try {
    const blob = await html2pdf().set({
      margin: 0, image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4' },
      pagebreak: { mode: ['css'], before: '.pg' }
    }).from(el).outputPdf('blob');
    downloadBlob(name, blob);
    toast('PDF saved');
  } catch(e){ toast('PDF failed: ' + e.message, 'err'); }
}

/* ---- USERS ---- */
function vUsers(){
  if (!S.isAdmin) return `<div class="card"><div class="empty">Only admins can manage users.</div></div>`;
  return `
    <div class="card">
      <h2>Google accounts <span class="badge">${S.users.length}</span></h2>
      <p style="color:var(--mu);font-size:12.5px;margin-bottom:14px">Every Google account that has signed in. Promote teachers to admin to grant full access.</p>
      ${S.users.length ? `<div class="tw"><table class="t">
        <tr><th></th><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr>
        ${S.users.map(u => `<tr>
          <td>${u.photoURL ? `<img class="avatar" src="${E(u.photoURL)}" alt="">` : '<div style="width:28px;height:28px;border-radius:50%;background:var(--sf2)"></div>'}</td>
          <td><b>${E(u.name||'')}</b></td>
          <td style="color:var(--mu)">${E(u.email||'')}</td>
          <td><span class="badge-role ${u.role==='admin'?'admin':'teacher'}">${E(u.role||'')}</span></td>
          <td>
            ${u.role === 'teacher' ? `<button class="btn s btn-sm" data-promote="${u.id}">⬆ Promote</button>` : ''}
            ${u.role === 'admin' && u.id !== S.user.uid ? `<button class="btn d btn-sm" data-demote="${u.id}">⬇ Demote</button>` : ''}
            ${u.id === S.user.uid ? '<span style="color:var(--mu);font-size:11px">(you)</span>' : ''}
          </td>
        </tr>`).join('')}
      </table></div>` : '<div class="empty">No users yet.</div>'}
    </div>
  `;
}
function bindUsers(){
  $$('[data-promote]').forEach(b => b.onclick = async () => {
    if (!await confirmDialog('Promote this user to admin?')) return;
    try { await FS.update('users/' + b.dataset.promote, { role: 'admin' }); toast('Promoted'); }
    catch(e){ toast('Failed: ' + e.message, 'err'); }
  });
  $$('[data-demote]').forEach(b => b.onclick = async () => {
    if (!await confirmDialog('Demote this admin to teacher?')) return;
    try { await FS.update('users/' + b.dataset.demote, { role: 'teacher' }); toast('Demoted'); }
    catch(e){ toast('Failed: ' + e.message, 'err'); }
  });
}

    <div class="card">
      <h2>School settings</h2>
      <p style="color:var(--mu);font-size:12.5px;margin-bottom:16px">These values print at the top of every report card.</p>
      <div class="grid g-2">

        <div class="row"><label style="flex:1">District<input id="st-district" value="${E(st.district||SCHOOL.district)}"></label></div>
        <div class="row"><label style="flex:1">Academic year<input id="st-year" value="${E(st.year||SCHOOL.year)}"></label></div>
        <div class="row"><label style="flex:1">Email<input id="st-email" value="${E(st.email||SCHOOL.email)}"></label></div>

function bindSettings(){

      });

/* ---- BACKUP ---- */
function vBackup(){
  return `
    <div class="card">
      <h2>Backup &amp; restore</h2>
      <p style="color:var(--mu);font-size:12.5px;margin-bottom:14px">Export all Firestore data to JSON, or restore a previous backup.</p>
      <div class="row">
        <button class="btn" id="bk-exp">📥 Export backup</button>
        <label class="btn g" style="cursor:pointer">📤 Import<input type="file" id="bk-imp" accept="application/json" style="display:none"></label>
        <button class="btn d" id="bk-clr">🗑 Clear all</button>
        <button class="btn s" id="bk-demo">✨ Load demo data</button>
      </div>
    </div>
    <div class="card">
      <h2>Data summary</h2>
      <div class="grid g-4">
        <div class="stat-card"><div class="label">Classes</div><div class="value">${S.cl.length}</div></div>
        <div class="stat-card"><div class="label">Students</div><div class="value">${S.st.length}</div></div>
        <div class="stat-card"><div class="label">Users</div><div class="value">${S.users.length}</div></div>
        <div class="stat-card"><div class="label">Subjects</div><div class="value">${S.cl.reduce((a,c)=>a+(c.subjects||[]).length,0)}</div></div>
      </div>
    </div>
  `;
}
function bindBackup(){
  $('#bk-exp').onclick = () => {
    const data = {
      version: 2, exportedAt: new Date().toISOString(),
      classes: Object.fromEntries(S.cl.map(c=>[c.id,c])),
      students: Object.fromEntries(S.st.map(s=>[s.id,s])),
      settings: S.settings
    };
    downloadBlob('backup-'+Date.now()+'.json', new Blob([JSON.stringify(data,null,2)], {type:'application/json'}));
    toast('Backup exported');
  };
  $('#bk-imp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!await confirmDialog('Import will add/replace data in Firestore. Continue?')) return;
      toast('Importing…', 'info');
      if (data.classes) for (const [id, cls] of Object.entries(data.classes)) await setDoc(doc(db,'classes',id), cls);
      if (data.students) {
        const entries = Object.entries(data.students);
        for (let i = 0; i < entries.length; i += 500) {
          const batch = writeBatch(db);
          for (const [id, stu] of entries.slice(i, i+500)) batch.set(doc(db,'students',id), stu);
          await batch.commit();
        }
      }
      if (data.settings) await setDoc(doc(db,'settings','school'), data.settings);
      toast('Backup restored');
    } catch(e){ toast('Import failed: ' + e.message, 'err'); }
  };
  $('#bk-clr').onclick = async () => {
    if (!await confirmDialog('Delete ALL classes, students, and settings from Firestore?')) return;
    try {
      const batch = writeBatch(db);
      S.cl.forEach(c => batch.delete(doc(db,'classes',c.id)));
      S.st.forEach(s => batch.delete(doc(db,'students',s.id)));
      if (Object.keys(S.settings).length) batch.delete(doc(db,'settings','school'));
      await batch.commit();
      toast('Data cleared');
    } catch(e){ toast('Failed: ' + e.message, 'err'); }
  };
  $('#bk-demo').onclick = async () => {
    if (!await confirmDialog('Load demo classes and students?')) return;
    try { await seedDemo(); toast('Demo data loaded'); }
    catch(e){ toast('Demo failed: ' + e.message, 'err'); }
  };
}

async function seedDemo(){
  const demo = [
    { id:'P4A', name:'P4A', combo:'PRIMARY', subjects:[
      {id:'sp4m',n:'Mathematics',w:50},{id:'sp4e',n:'English',w:50},{id:'sp4k',n:'Kinyarwanda',w:50},{id:'sp4s',n:'Science',w:50}
    ]},
    { id:'P5A', name:'P5A', combo:'PRIMARY', subjects:[
      {id:'sp5m',n:'Mathematics',w:50},{id:'sp5e',n:'English',w:50},{id:'sp5k',n:'Kinyarwanda',w:50},{id:'sp5s',n:'Science',w:50}
    ]},
    { id:'S1A', name:'S1A', combo:'MCB', subjects:[
      {id:'ss1m',n:'Mathematics',w:100},{id:'ss1b',n:'Biology',w:100},{id:'ss1c',n:'Chemistry',w:100},{id:'ss1e',n:'English',w:100}
    ]}
  ];
  for (const c of demo) if (!CL(c.id)) await setDoc(doc(db,'classes',c.id), c);
  const names = ['Aline Uwase','Eric Nkurunziza','Claudine Mukamana','Jean Bosco Habimana','Grace Uwera','Patrick Nsengimana','Solange Iradukunda','Emmanuel Rukundo'];
  let n = 0;
  for (const c of demo) {
    for (let i = 0; i < 6; i++) {
      const nm = names[(n+i) % names.length] + ' ' + (i+1);
      const uid = '271205' + (n+i+1).toString().padStart(6,'0');
      const id = ids(uid);
      if (S.st.find(s => s.id === id)) continue;
      const d = { name: nm, uid, cls: c.id, c1: 25+Math.floor(Math.random()*15), c2: 25+Math.floor(Math.random()*15), c3: 25+Math.floor(Math.random()*15) };
      for (const sub of c.subjects) {
        d['mt_'+sub.id+'_1'] = Math.floor(Math.random()*sub.w);
        d['mt_'+sub.id+'_2'] = Math.floor(Math.random()*sub.w);
        d['mt_'+sub.id+'_3'] = Math.floor(Math.random()*sub.w);
      }
      await setDoc(doc(db,'students',id), d);
    }
    n += 6;
  }
}

/* =========================================================
   BOOT
   ========================================================= */
draw();
</script>
