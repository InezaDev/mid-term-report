    rules_version = '2';
    service cloud.firestore {
      match /databases/{database}/documents {

        function isSignedIn() {

        function isAdmin() {

          allow read:          if isSignedIn();
          allow create, update: if isSignedIn();
          allow delete:        if isAdmin();
        }

        match /settings/{id} {

          allow write: if isAdmin();

<style>
:root{--bg:#000d1a;--sf:#0a1c33;--sf2:#0f2440;--tx:#f1f5f9;--mu:#9fb0c8;--bd:rgba(255,255,255,.14);--pr:#00a896;--pr2:#00d4bb;--pt:#00131f;--gd:#f2b705;--rd:#e5484d;--gn:#22c55e;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,Arial,sans-serif;overflow-x:hidden}
#oc{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
.lay{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

.card,.gc{background:rgba(0,24,48,.85);backdrop-filter:blur(16px);border:1px solid var(--bd);box-shadow:0 20px 40px rgba(0,0,0,.4);border-radius:12px;padding:16px;margin-bottom:16px}
.gc{max-width:440px;width:100%;text-align:center;padding:32px;margin:0}
.gc img{width:84px;height:84px;border-radius:8px;background:#fff}
.gc h1{font-size:22px;margin:14px 0 6px}
.gc p{color:var(--mu);margin:6px 0 20px}

nav.top{position:sticky;top:0;z-index:20;background:rgba(0,13,26,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center;cursor:pointer;background:none;border:0;color:inherit;text-align:left;padding:0}
.brand img{width:46px;height:46px;border-radius:6px;background:#fff}
.brand b{display:block;font-size:15px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--pr)}
.nl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nb{background:transparent;border:0;color:inherit;padding:7px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s}
.nb:hover{background:rgba(255,255,255,.1)}
.badge{font-size:12px;color:var(--pr);background:rgba(255,255,255,.07);border:1px solid var(--bd);padding:4px 10px;border-radius:8px;font-weight:600}
.profile{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:40px}
.profile img{width:28px;height:28px;border-radius:50%;background:#fff}
.profile span{font-size:13px;font-weight:600}

main{padding:24px 16px;max-width:1150px;width:100%;margin:0 auto;flex:1;min-width:0}
footer{text-align:center;font-size:12px;color:var(--mu);padding:14px;background:rgba(0,13,26,.92);border-top:1px solid var(--bd)}

.hero{text-align:center;padding:36px 22px;max-width:880px;margin:16px auto}
.hero img{width:96px;height:96px;border-radius:10px;background:#fff}
.hero h2{font-size:32px;line-height:1.15;margin:14px 0 10px}
.hero p{color:var(--mu);max-width:600px;margin:0 auto}
.tri{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:26px;text-align:left}
.tri button{background:rgba(0,24,48,.85);border:1px solid var(--bd);border-radius:12px;padding:18px;color:inherit;text-align:left;cursor:pointer;transition:.15s}
.tri button:hover{border-color:var(--pr);transform:translateY(-2px)}
.tri b{display:block;font-size:15px;margin-bottom:4px}
.tri span{font-size:13px;color:var(--mu)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:rgba(0,24,48,.85);border:1px solid var(--bd);color:inherit;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;transition:.15s}
.tabs button:hover{border-color:var(--pr)}
.tabs button.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}

.mo{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);z-index:50;display:grid;place-items:center;padding:16px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.er{background:rgba(229,72,77,.15);border:1px solid var(--rd);padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:14px;text-align:left;color:#ffb3b5}

h2{margin:0 0 14px;font-size:22px}

.btn{background:var(--pr);color:var(--pt);border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{background:var(--pr2)}
.btn.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.btn.s:hover{background:rgba(0,168,150,.12)}
.btn.d{background:var(--rd);color:#fff}
.btn.d:hover{background:#ef5350}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.g:hover{background:rgba(255,255,255,.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}

button,input,select,textarea{font:inherit;color:inherit}
.btn:focus-visible,.nb:focus-visible,.tabs button:focus-visible,.tri button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gd);outline-offset:1px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
input,select,textarea{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--pr);outline:none}

.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:left}
table.t th{color:var(--pr);font-size:13px;font-weight:600}
table.t tr:hover td{background:rgba(0,168,150,.04)}
table.t input.m{width:80px}
table.t img.avatar{width:32px;height:32px;border-radius:50%;background:#fff}

.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat div{border-left:4px solid var(--gd);padding:4px 12px}
.stat b{font-size:26px;display:block;font-weight:700}
.stat span{color:var(--mu);font-size:13px}

.bar-wrap{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.bar-row{display:grid;grid-template-columns:110px 1fr 60px;gap:10px;align-items:center;font-size:13px}
.bar-track{background:rgba(255,255,255,.08);height:8px;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));border-radius:4px;transition:width .4s}
.bar-val{text-align:right;color:var(--mu)}

.empty{color:var(--mu);padding:18px;text-align:center}
.pv{overflow-x:auto;background:#5d6b82;padding:14px;border-radius:10px}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;max-width:340px}

#toasts{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:rgba(0,168,150,.95);color:var(--pt);padding:11px 18px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:slideIn .25s;pointer-events:auto;max-width:340px}
.toast.err{background:rgba(229,72,77,.95);color:#fff}
.toast.info{background:rgba(15,36,64,.98);color:var(--tx);border:1px solid var(--bd)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.rp{width:794px;min-height:1120px;background:#fff;color:#000;font:11px Arial,Helvetica,sans-serif;padding:24px;margin:0 auto;box-sizing:border-box}
.rp table{border-collapse:collapse;width:100%}
.rp td,.rp th{border:1px solid #000;padding:3px 2px;text-align:center;font-size:10px}

.rp .r{color:#e00}
.rp .hd{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.rp .hd div.ad{font-size:10px;line-height:1.35;width:230px}
.rp .bx{border:1px solid #000;padding:10px 28px;font-weight:700;font-size:14px;text-align:center;margin-top:6px}
.rp .nm{border:2px solid #000;padding:8px;display:flex;justify-content:space-between;font-size:11px;margin-bottom:10px}
.rp .gs{background:#bbb;text-align:left}
.rp .sec{display:flex;gap:10px;margin-top:10px}
.rp .gr td{height:20px}
.rp .bd{border:2px solid #000;padding:8px;font-size:10px;flex:1;display:flex;justify-content:space-between;gap:10px}

@media(max-width:760px){main{padding:14px 10px}.hero h2{font-size:25px}.rp{width:100%;min-height:auto;padding:14px}}

@media print{
  body{background:#fff;color:#000}
  #oc,nav.top,footer,.tabs,.row,.btn,.mo,#toasts{display:none!important}
  main{padding:0;max-width:none}
  .card,.pv{background:#fff;border:0;box-shadow:none;padding:0;margin:0}
  .rp{margin:0;padding:14mm;width:auto;min-height:auto;box-shadow:none;page-break-after:always}
}

function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + (type === 'err' ? 'err' : type === 'info' ? 'info' : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(100%)'; t.style.transition = '.25s'; }, 3000);
  setTimeout(() => t.remove(), 3400);
}

function confirmDialog(msg) {
  return new Promise(resolve => {
    const mo = document.createElement('div');
    mo.className = 'mo';
    mo.innerHTML = `<div class="gc" style="max-width:380px"><h1 style="font-size:17px">Confirm</h1><p style="color:var(--tx);margin:12px 0 18px">${E(msg)}</p><div class="row" style="justify-content:center"><button class="btn g" id="cno">Cancel</button><button class="btn d" id="cyes">Confirm</button></div></div>`;
    document.body.appendChild(mo);
    mo.querySelector('#cyes').onclick = () => { mo.remove(); resolve(true); };
    mo.querySelector('#cno').onclick  = () => { mo.remove(); resolve(false); };
  });
}

function downloadBlob(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function googleSignIn() {
  try {
    await signInWithPopup(auth, googleProvider);
  } catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/cancelled-popup-request') {
      toast('Popup blocked — redirecting…', 'info');
      await signInWithRedirect(auth, googleProvider);
    } else if (e.code === 'auth/popup-closed-by-user') {
      // user closed popup; no-op
    } else {
      toast('Sign-in failed: ' + (e.message || e.code), 'err');
    }
  }
}

async function googleSignOut() {
  try {
    await fbSignOut(auth);
    S.user = null;
    S.isAdmin = false;
    S.route = 'home';
    S.tab = 'ov';
    S.cl = []; S.st = []; S.users = []; S.settings = {};
    toast('Signed out', 'info');
    draw();
  } catch (e) {
    toast('Sign-out failed', 'err');
  }
}

/**
 * Get existing user doc, or create a new one.
 * First user to ever sign in becomes admin.
 */
async function getOrCreateProfile(user) {
  const userRef = doc(db, 'users', user.uid);
  const snap = await getDoc(userRef);

  if (snap.exists()) return snap.data();

  // First user becomes admin
  let hasAdmin = false;
  try {
    const all = await getDocs(collection(db, 'users'));
    hasAdmin = all.docs.some(d => d.data().role === 'admin');
  } catch (e) {
    console.warn('Could not read users collection', e);
  }

  const profile = {
    email: user.email,
    name: user.displayName || user.email,
    photoURL: user.photoURL || '',
    role: hasAdmin ? 'teacher' : 'admin',
    createdAt: new Date().toISOString()
  };

  try {
    await setDoc(userRef, profile);
  } catch (e) {
    toast('Could not save profile: ' + e.message, 'err');
  }
  return profile;
}

/* =========================================================
   AUTH STATE — the single source of truth
   ========================================================= */
onAuthStateChanged(auth, async (fbUser) => {
  if (!fbUser) {
    S.user = null;
    S.isAdmin = false;
    S.route = 'home';
    S.ready = true;
    draw();
    return;
  }

  try {
    const profile = await getOrCreateProfile(fbUser);
    S.user = {
      uid: fbUser.uid,
      email: profile.email || fbUser.email,
      name: profile.name || fbUser.displayName || fbUser.email,
      photoURL: profile.photoURL || fbUser.photoURL || '',
      role: profile.role || 'teacher'
    };
    S.isAdmin = S.user.role === 'admin';
    if (S.route === 'home') {
      S.route = 'portal';
      S.tab = S.isAdmin ? 'ov' : 'students';
    }
  } catch (e) {
    console.error('Profile load failed', e);
    toast('Could not load user profile: ' + e.message, 'err');
    S.ready = true;
    draw();
    return;
  }
  S.ready = true;
  draw();
});

let listenersAttached = false;
function attachListeners() {
  if (listenersAttached) return;
  listenersAttached = true;

  onSnapshot(collection(db, 'classes'),
    snap => {
      S.cl = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      recalc();
      if (S.ready) draw();
    },
    err => console.error('classes snapshot', err)
  );

  onSnapshot(collection(db, 'students'),
    snap => {
      S.st = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      recalc();
      if (S.ready) draw();
    },
    err => console.error('students snapshot', err)
  );

  onSnapshot(doc(db, 'settings', 'school'),
    snap => {
      S.settings = snap.exists() ? snap.data() : {};
      if (S.ready) draw();
    },
    err => console.error('settings snapshot', err)
  );

  onSnapshot(collection(db, 'users'),
    snap => {
      S.users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (S.ready) draw();
    },
    err => console.error('users snapshot', err)
  );
}

onAuthStateChanged(auth, u => { if (u) attachListeners(); });

/* =========================================================
   CALCULATIONS
   ========================================================= */
function calc(s) {
  const sb = CL(s.cls)?.subjects || [];
  const k = S.term;
  const mx = sb.reduce((a, b) => a + b.w, 0) || 1;
  let has = false, tot = 0;
  const r = sb.map(b => {
    const v = s['mt_' + b.id + '_' + k];
    const a = (v == null || v === '') ? null : +v;
    if (a != null) has = true;
    tot += a || 0;
    return { a, p: (a || 0) / b.w * 100 };
  });
  return { sb, r, tot, mx, has, p: tot / mx * 100 };
}

function recalc() {
  S.calc = {};
  S.ranks = {};
  S.st.forEach(s => S.calc[s.id] = calc(s));
  S.cl.forEach(cl => {
    const L = S.st.filter(s => s.cls === cl.id && S.calc[s.id].has);
    L.forEach(s => {
      S.ranks[s.id] = (1 + L.filter(o => S.calc[o.id].p > S.calc[s.id].p).length) + ' out of ' + L.length;
    });
  });
}

/* =========================================================
   REPORT CARD (Rwanda CAMIS layout)
   ========================================================= */
function report(s) {

/* =========================================================
   OCEAN CANVAS
   ========================================================= */
function initOcean() {
  const cv = $('#oc'), x = cv.getContext('2d');
  const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, st = 0;
  const rs = () => { w = cv.width = innerWidth; h = cv.height = innerHeight; };
  rs();
  addEventListener('resize', rs);
  const mk = p => Object.assign(p, { x: Math.random() * w, y: h + Math.random() * 100, r: Math.random() * 2.5 + 1, v: Math.random() * 1.2 + .4, a: Math.random() * .4 + .2 });
  const P = Array.from({ length: 50 }, () => mk({}));
  const fr = () => {
    x.clearRect(0, 0, w, h);
    const g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#000d1a'); g.addColorStop(.5, '#001a33'); g.addColorStop(1, '#00050d');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    P.forEach(p => {
      if (!rm) p.y -= p.v;
      if (p.y < -10) mk(p);
      x.fillStyle = `rgba(0,168,150,${p.a})`;
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.283); x.fill();
    });
    st += .02;
    x.fillStyle = 'rgba(0,168,150,.04)';
    x.beginPath(); x.moveTo(0, h);
    for (let i = 0; i <= w; i += 20) x.lineTo(i, Math.sin(i * .01 + st) * 18 + h - 80);
    x.lineTo(w, h); x.fill();
    if (!rm) requestAnimationFrame(fr);
  };
  fr();
}

function navTabs() {

function renderPortal() {
  if (!S.cl.find(c => c.id === S.cur)) S.cur = S.cl.slice().sort(cmp)[0]?.id || null;
  const tabs = navTabs();
  if (!tabs.find(([k]) => k === S.tab)) S.tab = tabs[0][0];

  const showClassBar = !['cs','ov','users','settings','backup'].includes(S.tab);
  const showTermBar  = !['cs','users','settings','backup'].includes(S.tab);

  page(`<h2>${S.isAdmin ? 'Admin Command Center' : 'Teacher Dashboard'}</h2>
    <div class="tabs">${tabs.map(([k,l]) => `<button class="${S.tab === k ? 'on' : ''}" data-t="${k}">${l}</button>`).join('')}</div>
    ${(showClassBar || showTermBar) ? `<div class="card"><div class="row">
      ${showClassBar ? `<label>Class
        <select id="cc">${S.cl.slice().sort(cmp).map(c => `<option value="${c.id}" ${c.id === S.cur ? 'selected' : ''}>${E(c.name)}</option>`).join('') || '<option>No classes yet</option>'}</select>

      ${showTermBar ? `<label>Mid-term of
        <select id="tm">${[1,2,3].map(n => `<option value="${n}" ${n === S.term ? 'selected' : ''}>Term ${n}</option>`).join('')}</select>
      </label>` : ''}
    </div></div>` : ''}

  const cc = $('#cc'); if (cc) cc.onchange = e => { S.cur = e.target.value; S.sel = S.sub = null; draw(); };
  const tm = $('#tm'); if (tm) tm.onchange = e => { S.term = +e.target.value; recalc(); draw(); };

function viewFor(tab) {
  if (!S.cl.find(c => c.id === S.cur) && !['ov','cs','users','settings','backup'].includes(tab)) {
    return `<div class="card empty">${S.isAdmin ? 'Create a class first under Classes & subjects.' : 'The admin has not created any classes yet.'}</div>`;
  }
  return ({ ov: vOverview, cs: vClasses, students: vStudents, marks: vMarks, reports: vReports, users: vUsers, settings: vSettings, backup: vBackup })[tab]();
}

function bindFor(tab) {
  ({ ov: () => {}, cs: bindClasses, students: bindStudents, marks: bindMarks, reports: bindReports, users: bindUsers, settings: bindSettings, backup: bindBackup })[tab]();
}

/* ---- Overview ---- */

  const lo = L.filter(s => S.calc[s.id].p < 50).length;
  const rows = S.cl.slice().sort(cmp).map(c => {
    const M = S.st.filter(s => s.cls === c.id && S.calc[s.id].has);
    const avg = M.length ? M.reduce((a, s) => a + S.calc[s.id].p, 0) / M.length : 0;
    return { name: c.name, students: S.st.filter(s => s.cls === c.id).length, subjects: (c.subjects || []).length, avg };
  });
  return `<h2>Overview – Term ${S.term} mid-term</h2>
    <div class="card stat">
      <div><b>${S.cl.length}</b><span>Classes</span></div>
      <div><b>${S.st.length}</b><span>Students</span></div>
      <div><b>${S.users.length}</b><span>Google accounts</span></div>
      <div><b>${F(av)}%</b><span>School average</span></div>
      <div><b>${lo}</b><span>Students below 50%</span></div>

    <div class="card">
      <b>Average by class</b>

        ${rows.map(r => `
          <div class="bar-row">

}

function bindClasses() {
  const mk = (n, cb) => FS.set('classes/' + ids(n), { name: n.trim(), combo: cb || '', subjects: CL(ids(n))?.subjects || [] });
  $('#ac').onclick = async () => {
    const n = $('#cn').value;
    if (!n.trim()) return toast('Enter a class name', 'err');
    try { await mk(n, $('#cb').value); S.cur = ids(n); toast('Class created'); }
    catch (e) { toast('Create failed: ' + e.message, 'err'); }
  };
  $('#aq').onclick = async () => {
    let added = 0;
    try {
      for (const n of ['P1','P2','P3','P4','P5','P6','S1','S2','S3','S4','S5','S6']) {
        if (!CL(n)) { await mk(n, ''); added++; }
      }
      toast(added + ' classes added');
    } catch (e) { toast('Bulk add failed: ' + e.message, 'err'); }
  };
  const c = CUR();
  $('#cc2').onchange = e => { S.cur = e.target.value; draw(); };
  if (!c) return;
  const save = a => FS.update('classes/' + c.id, { subjects: a });
  const sb = () => (c.subjects || []).map(x => ({ ...x }));
  $('#dc').onclick = async () => {
    if (await confirmDialog('Delete class ' + c.name + '? Its students stay in the database but will have no class.')) {
      try { await FS.delete('classes/' + c.id); toast('Class deleted'); }
      catch (e) { toast('Delete failed: ' + e.message, 'err'); }
    }
  };
  $('#as').onclick = async () => {
    const n = $('#bn').value.trim(), w = +$('#bw').value;
    if (!n || !(w > 0)) return toast('Enter subject name and max mark', 'err');
    try { await save([...sb(), { id: 's' + Date.now().toString(36), n, w }]); toast('Subject added'); }
    catch (e) { toast('Failed: ' + e.message, 'err'); }
  };
  $('#cf').onchange = async e => {
    const o = CL(e.target.value);
    if (o && await confirmDialog('Replace subjects of ' + c.name + ' with those of ' + o.name + '?')) {
      try { await save(o.subjects.map(x => ({ id: 's' + Math.random().toString(36).slice(2, 8), n: x.n, w: x.w }))); toast('Subjects copied'); }
      catch (e) { toast('Failed: ' + e.message, 'err'); }
    }
  };
  $$('[data-ds]').forEach(b => b.onclick = async () => {
    if (await confirmDialog('Remove this subject? Its marks are no longer shown.')) {
      try { await save(sb().filter(x => x.id !== b.dataset.ds)); toast('Subject removed'); }
      catch (e) { toast('Failed: ' + e.message, 'err'); }
    }
  });
  $$('.sn,.sw').forEach(i => i.onchange = async () => {
    const a = sb(), x = a.find(y => y.id === i.dataset.s);
    if (i.classList.contains('sn')) x.n = i.value.trim() || x.n;
    else x.w = Math.max(1, +i.value || x.w);
    try { await save(a); } catch (e) { toast('Failed: ' + e.message, 'err'); }
  });
}

function bindStudents() {
  const add = async (n, i) => {
    n = (n || '').trim(); i = (i || '').trim();
    if (!n || !i) return false;
    const id = ids(i);
    if (S.st.find(s => s.id === id)) { toast('Student ID ' + i + ' already exists', 'err'); return false; }
    try { await FS.set('students/' + id, { name: n, uid: i, cls: S.cur }); return true; }
    catch (e) { toast('Failed: ' + e.message, 'err'); return false; }
  };
  $('#add').onclick = async () => {
    if (await add($('#sn').value, $('#si').value)) {
      $('#sn').value = $('#si').value = '';
      toast('Student registered');
    }
  };
  $('#bl').onclick = async () => {
    let ok = 0;
    for (const l of $('#bulk').value.split('\n')) {
      const p = l.split(',');
      if (p.length > 1 && await add(p[0], p[1])) ok++;
    }
    $('#bulk').value = '';
    toast(ok + ' students registered');
  };
  $('#srch').oninput = e => { S.search = e.target.value; draw(); };
  $('#clr').onclick = () => { S.search = ''; draw(); };
  $$('[data-del]').forEach(b => b.onclick = async () => {
    if (await confirmDialog('Delete this student and all their marks?')) {
      try { await FS.delete('students/' + b.dataset.del); toast('Student deleted'); }
      catch (e) { toast('Failed: ' + e.message, 'err'); }
    }
  });
  $$('.mv').forEach(i => i.onchange = async () => {
    try { await FS.update('students/' + i.dataset.id, { cls: i.value }); }
    catch (e) { toast('Failed: ' + e.message, 'err'); }
  });
  $$('.cd').forEach(i => i.onchange = async () => {
    try { await FS.update('students/' + i.dataset.id, { [i.dataset.k]: i.value === '' ? null : Math.min(40, +i.value) }); }
    catch (e) { toast('Failed: ' + e.message, 'err'); }
  });
}

/* ---- Marks ---- */
function vMarks() {
  const sb = SB();
  if (!sb.length) return `<div class="card empty">${S.isAdmin ? 'Add subjects to this class under Classes & subjects.' : 'The admin has not registered subjects for this class yet.'}</div>`;
  if (!sb.find(b => b.id === S.sub)) S.sub = sb[0].id;
  const b = sb.find(x => x.id === S.sub), w = b.w;
  const M = MS().slice().sort((a, c) => a.name.localeCompare(c.name));
  return `<h2>Mid-term marks</h2>
    <div class="card">
      <div class="row">
        <label>Subject<select id="sb">${sb.map(x => `<option value="${x.id}" ${x.id === S.sub ? 'selected' : ''}>${E(x.n)}</option>`).join('')}</select></label>
      </div>
      <p style="color:var(--mu);font-size:13px">Enter each student's Term ${S.term} mid-term mark out of ${w}. Marks save as you type.</p>
    </div>
    <div class="card tw">
      ${M.length ? `<table class="t">
        <tr><th>Student</th><th>Mark /${w}</th><th>%</th></tr>
        ${M.map(s => {
          const v = s[`mt_${b.id}_${S.term}`];
          return `<tr>
            <td>${E(s.name)}</td>
            <td><input class="m mi" type="number" min="0" max="${w}" data-id="${s.id}" value="${v ?? ''}"></td>
            <td>${v == null || v === '' ? '-' : F(+v / w * 100) + '%'}</td>
          </tr>`;
        }).join('')}
      </table>` : '<p class="empty">No students in this class yet.</p>'}
    </div>`;
}

function bindMarks() {
  const sb = $('#sb');
  if (!sb) return;
  sb.onchange = e => { S.sub = e.target.value; draw(); };
  const w = SB().find(x => x.id === S.sub).w;
  $$('.mi').forEach(i => i.onchange = async () => {
    try {
      await FS.update('students/' + i.dataset.id, {
        [`mt_${S.sub}_${S.term}`]: i.value === '' ? null : Math.min(w, Math.max(0, +i.value))
      });
    } catch (e) { toast('Failed: ' + e.message, 'err'); }
  });
}

/* ---- Reports ---- */
function vReports() {
  const M = MS().slice().sort((a, b) => a.name.localeCompare(b.name));
  if (!S.sel || !M.find(s => s.id === S.sel)) S.sel = M[0]?.id;
  const s = M.find(x => x.id === S.sel);
  return `<h2>Report cards</h2>
    <div class="card">
      <div class="row">
        <label>Student<select id="ps">${M.map(x => `<option value="${x.id}" ${x.id === S.sel ? 'selected' : ''}>${E(x.name)}</option>`).join('')}</select></label>
        <button class="btn" id="dl" ${s ? '' : 'disabled'}>Download PDF</button>
        <button class="btn s" id="da" ${s ? '' : 'disabled'}>Download whole class</button>
        <button class="btn g" id="pr" ${s ? '' : 'disabled'}>Print</button>
      </div>
    </div>
    ${s ? `<div class="pv"><div id="one">${report(s)}</div></div>` : '<p class="empty">No students in this class yet.</p>'}
    <div id="all" style="position:fixed;left:-9999px;top:0"></div>`;
}

function bindReports() {
  const sel = $('#ps');
  if (!sel) return;
  sel.onchange = e => { S.sel = e.target.value; draw(); };
  const s = S.st.find(x => x.id === S.sel);
  const cn = CUR().name;
  $('#dl').onclick = () => pdf($('#one .rp'), 'Midterm-T' + S.term + '-' + ids(s.name) + '.pdf');
  $('#pr').onclick = () => window.print();
  $('#da').onclick = () => {
    $('#all').innerHTML = MS().sort((a, b) => a.name.localeCompare(b.name)).map(x => `<div class="pg">${report(x)}</div>`).join('');
    pdf($('#all'), 'Midterm-T' + S.term + '-' + ids(cn) + '-all.pdf');
  };
}

async function pdf(el, name) {
  toast('Preparing PDF…', 'info');
  try {
    const blob = await html2pdf().set({
      margin: 0,
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4' },
      pagebreak: { mode: ['css'], before: '.pg' }
    }).from(el).outputPdf('blob');
    downloadBlob(name, blob);
    toast('PDF saved');
  } catch (e) {
    toast('PDF failed: ' + e.message, 'err');
  }
}

/* ---- Users (admin only) ---- */

  return `<h2>Users</h2>
    <div class="card">

      ${S.users.length ? `<table class="t">

          <td>${u.photoURL ? `<img class="avatar" src="${E(u.photoURL)}" alt="">` : '—'}</td>

function bindUsers() {

/* ---- Backup ---- */
function vBackup() {
  return `<h2>Backup & restore</h2>
    <div class="card">
      <p style="color:var(--mu);font-size:13px">Export all Firestore data to a JSON file, or restore a previous backup.</p>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="bk-exp">📥 Export backup</button>
        <label class="btn g" style="cursor:pointer">📤 Import backup<input type="file" id="bk-imp" accept="application/json" style="display:none"></label>
        <button class="btn d" id="bk-clr">🗑 Clear all data</button>
        <button class="btn s" id="bk-demo">✨ Load demo data</button>
      </div>
    </div>
    <div class="card">
      <b>Firestore collections</b>
      <ul style="color:var(--mu);font-size:13px;line-height:1.8;padding-left:20px">
        <li>${S.cl.length} classes</li>
        <li>${S.st.length} students</li>
        <li>${S.users.length} users</li>
        <li>${S.cl.reduce((a, c) => a + (c.subjects || []).length, 0)} subjects</li>
      </ul>
    </div>`;
}

function bindBackup() {
  $('#bk-exp').onclick = () => {
    const data = {
      version: 2,
      exportedAt: new Date().toISOString(),
      classes: Object.fromEntries(S.cl.map(c => [c.id, c])),
      students: Object.fromEntries(S.st.map(s => [s.id, s])),
      settings: S.settings
    };
    downloadBlob('backup-' + Date.now() + '.json', new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    toast('Backup exported');
  };
  $('#bk-imp').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const txt = await f.text();
      const data = JSON.parse(txt);
      if (!await confirmDialog('Import will ADD/REPLACE data in Firestore. Continue?')) return;
      toast('Importing…', 'info');
      if (data.classes) {
        for (const [id, cls] of Object.entries(data.classes)) {
          await setDoc(doc(db, 'classes', id), cls);
        }
      }
      if (data.students) {
        const entries = Object.entries(data.students);
        for (let i = 0; i < entries.length; i += 500) {
          const batch = writeBatch(db);
          for (const [id, stu] of entries.slice(i, i + 500)) {
            batch.set(doc(db, 'students', id), stu);
          }
          await batch.commit();
        }
      }
      if (data.settings) {
        await setDoc(doc(db, 'settings', 'school'), data.settings);
      }
      toast('Backup restored');
    } catch (e) {
      toast('Import failed: ' + e.message, 'err');
    }
  };
  $('#bk-clr').onclick = async () => {
    if (!await confirmDialog('Delete ALL classes, students, and settings from Firestore? This cannot be undone.')) return;
    try {
      const batch = writeBatch(db);
      S.cl.forEach(c => batch.delete(doc(db, 'classes', c.id)));
      S.st.forEach(s => batch.delete(doc(db, 'students', s.id)));
      if (Object.keys(S.settings).length) batch.delete(doc(db, 'settings', 'school'));
      await batch.commit();
      toast('All data cleared');
    } catch (e) { toast('Clear failed: ' + e.message, 'err'); }
  };
  $('#bk-demo').onclick = async () => {
    if (!await confirmDialog('Load demo classes and students? Existing data will be preserved.')) return;
    try { await seedDemo(); toast('Demo data loaded'); }
    catch (e) { toast('Demo failed: ' + e.message, 'err'); }
  };
}
